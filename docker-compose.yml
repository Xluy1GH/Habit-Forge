services:
  redis:
    image: redis:alpine
    ports: 
      - "6379:6379"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes: 
      - .:/app
    environment: 
      - "CELERY_BROKER_URL=redis://redis:6379/0"
      - "CELERY_RESULT_BACKEND=redis://redis:6379/0"
    ports: 
      - "8000:8000"
    depends_on: 
      - "redis"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  celery_worker:
    build: .
    command: celery -A habitforge worker --loglevel=info
    volumes: 
      - .:/app
    environment: 
      - "CELERY_BROKER_URL=redis://redis:6379/0"
      - "CELERY_RESULT_BACKEND=redis://redis:6379/0"
    depends_on: 
      - "redis"

  celery_beat:
    build: .
    command: celery -A habitforge beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes: 
      - .:/app
    environment: 
      - "CELERY_BROKER_URL=redis://redis:6379/0"
      - "CELERY_RESULT_BACKEND=redis://redis:6379/0"
    depends_on: 
      - "redis"
